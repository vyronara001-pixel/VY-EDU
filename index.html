 intro:"Chemistry studies the composition, structure, properties and transformations of matter. Before studying reactions, we need a reliable way to describe how much matter is present and how substances combine.",

 ["1. Matter and its classification","Matter is anything that has mass and occupies space. A pure substance has a fixed composition and characteristic properties. Elements contain one kind of atom; compounds contain two or more elements chemically combined in a fixed ratio. Mixtures contain substances physically combined in variable proportions.","Example: distilled water is a compound, oxygen is an element, and air is a mixture."],
 ["2. Physical and chemical properties","A physical property can be observed without changing the chemical identity of a substance, such as density, colour or melting point. A chemical property describes how a substance can form new substances, such as iron's tendency to rust.","A physical change does not create a new substance; a chemical change involves a change in chemical composition."],
 ["3. Laws of chemical combination","The law of conservation of mass states that mass is neither created nor destroyed in a chemical reaction. The law of definite proportions states that a pure compound always contains the same elements in the same fixed proportion by mass. These laws helped establish quantitative chemistry.","If 12 g of carbon reacts completely with 32 g of oxygen, 44 g of carbon dioxide is formed: total mass remains 44 g."],
 ["4. Atomic and molecular masses","Atomic mass is the average mass of an atom relative to 1/12 of the mass of a carbon-12 atom. Molecular mass is the sum of the atomic masses of all atoms in a molecule. Formula mass is used for ionic compounds.","For H₂O: molecular mass = 2(1 u) + 16 u = 18 u."],
 ["5. The mole concept","A mole is the amount of substance containing exactly 6.02214076 × 10²³ specified entities. This number is the Avogadro constant. The entities may be atoms, molecules, ions or other particles.","Number of moles: n = given mass / molar mass. Number of particles = n × Avogadro constant."],
 ["6. Percentage composition and empirical formula","Percentage composition tells the mass percentage of each element in a compound. An empirical formula gives the simplest whole-number ratio of atoms; a molecular formula gives the actual number of atoms in a molecule.","To obtain an empirical formula from percentages: convert each percentage to moles by dividing by atomic mass, then divide all mole values by the smallest value and simplify."],
 ["7. Stoichiometry and limiting reagent","A balanced chemical equation gives the mole ratio in which reactants combine and products form. The limiting reagent is the reactant that is consumed first and therefore limits the maximum amount of product.","Always balance the equation first, convert given quantities to moles, compare them with the equation's mole ratio, and identify the limiting reactant."]
 ],formulas:["n = m / M","N = n × Nₐ","Molarity (M) = moles of solute / volume of solution in litres","Mass % = (mass of component / total mass) × 100"]

 intro:"Atoms are the basic units of chemical elements. Modern atomic theory explains atoms through a tiny, dense nucleus containing protons and neutrons, with electrons described by quantum-mechanical orbitals.",
 sections:[
 ["1. Subatomic particles","Electrons carry negative charge, protons carry positive charge, and neutrons have no electric charge. Protons and neutrons are concentrated in the nucleus; electrons occupy the space around it.","Atomic number Z = number of protons. For a neutral atom, electrons = protons. Mass number A = protons + neutrons."],
 ["2. Atomic models","Thomson proposed a positively charged sphere with electrons embedded in it. Rutherford's alpha-particle experiment showed that most of the atom is empty space and that positive charge is concentrated in a small nucleus. Bohr proposed quantised electron orbits for hydrogen-like species.","Rutherford's model could not explain atomic stability and line spectra; Bohr's model explained the hydrogen spectrum but was limited for multi-electron atoms."],
 ["3. Electromagnetic radiation and spectra","Light has wave properties described by wavelength and frequency. The speed of light is c = νλ. Atoms absorb or emit particular energies, producing characteristic line spectra.","Energy of a photon: E = hν = hc/λ."],
 ["4. Bohr model","For a hydrogen-like species, electrons can occupy certain allowed energy levels. A transition between levels involves absorption or emission of a photon whose energy equals the energy difference.","The model is useful for hydrogen and one-electron ions such as He⁺, but not a complete model for multi-electron atoms."],
 ["5. Quantum mechanical model","Electrons show wave-particle duality. The Schrödinger equation describes allowed wave functions. An orbital is a region in which the probability of finding an electron is high; it is not a fixed circular path.","The four quantum numbers describe shell, subshell, orbital orientation and electron spin."],
 ["6. Orbitals and electron configuration","Orbitals are grouped into s, p, d and f subshells. Electrons fill lower-energy orbitals first (Aufbau principle), occupy degenerate orbitals singly before pairing (Hund's rule), and no two electrons in an atom have the same four quantum numbers (Pauli exclusion principle).","Maximum electrons in a shell = 2n². An s subshell holds 2, p holds 6, d holds 10 and f holds 14 electrons."]

 intro:"Accounting is an information system that identifies, records, classifies, summarises and communicates financial information so that users can make informed decisions.",

 ["2. Users of accounting information","Internal users include owners and managers. External users include investors, lenders, suppliers, employees, government agencies and customers. Different users need different information.","A bank may study financial statements before deciding whether to lend money."],
 ["3. Bookkeeping and accounting","Bookkeeping mainly concerns the systematic recording of financial transactions. Accounting includes recording as well as classifying, summarising, analysing and communicating information.","Bookkeeping is an important part of the broader accounting process."],
 ["4. Basic accounting terms","Assets are resources controlled by a business; liabilities are obligations; capital is the owner's claim; revenue is income from ordinary activities; expenses are costs incurred to earn revenue; drawings are withdrawals by the owner.","If the owner invests cash in a business, cash (asset) and capital both increase."],
 ["5. Accounting equation","The basic equation expresses the relationship between assets, liabilities and owner's equity. Every transaction affects at least two aspects while keeping the equation balanced.","Assets = Capital + Liabilities. If a business has assets of ₹1,00,000 and liabilities of ₹30,000, capital is ₹70,000."],

 ["2. Business, profession and employment","Business involves producing or exchanging goods and services. A profession requires specialised knowledge and usually formal qualifications. Employment involves working for another person or organisation under an agreement.","A shopkeeper conducts business, a chartered accountant practises a profession, and a salaried teacher is employed."],
 ["3. Characteristics of business","Business includes an economic activity, production or procurement of goods and services, sale or exchange, regular dealings, a profit motive and an element of risk. A single isolated sale is not normally treated as a business.","Profit is important for continuity, but businesses also have responsibilities towards customers, workers, society and the environment."],

 ["2. Opportunity cost","Opportunity cost is the value of the next best alternative that is sacrificed when a choice is made.","If a person uses ₹500 to buy a book instead of a game, the game is the next best alternative forgone."],
 ["3. Central problems of an economy","Every economy must decide what goods and services to produce, how to produce them and for whom to produce them. These questions arise because resources are scarce and have alternative uses.","An economy may choose between producing more consumer goods or investing in machinery for future production."],
 ["4. Positive and normative economics","Positive statements describe facts or testable relationships. Normative statements express value judgements about what ought to happen.","'A rise in price may reduce quantity demanded' is positive; 'the government should lower this price' is normative."],

 ],formulas:["Opportunity cost = value of the next best alternative forgone"]

 sections:[

 ["2. Biodiversity","Biodiversity refers to the variety of living organisms. Scientists have described a large number of species, while many more are still being studied.","Classification makes it easier to identify organisms and understand relationships among them."],
 ["3. Taxonomy and systematics","Taxonomy deals with identification, nomenclature and classification. Systematics also considers evolutionary relationships among organisms.","Scientific names reduce confusion caused by different local names."],
 ["4. Binomial nomenclature","Each species is given a two-part scientific name: the genus name followed by the specific epithet. The genus begins with a capital letter and the specific epithet with a lowercase letter; both are italicised when printed.","Example format: Homo sapiens. When handwritten, the two words are underlined separately."],
 ["5. Taxonomic hierarchy","Organisms are arranged in ranked categories. The common sequence is species, genus, family, order, class, phylum or division, and kingdom.","Species is the basic unit of classification. As we move to higher categories, the number of organisms generally increases while shared similarities become broader."]
 ],formulas:["Hierarchy: Species → Genus → Family → Order → Class → Phylum/Division → Kingdom"]

 sections:[

 ["2. Ways to represent sets","A set may be described in roster form by listing its elements, or in set-builder form by stating a property that its elements satisfy.","A = {2,4,6,8} can be written as A = {x : x is an even natural number and 2 ≤ x ≤ 8}."],
 ["3. Types of sets","A finite set has a limited number of elements; an infinite set does not. The empty set has no elements. Equal sets have exactly the same elements, while equivalent sets have the same number of elements.","The empty set is written ∅ or {}. It is different from {0}, which contains one element."],
 ["4. Subsets and power sets","A is a subset of B if every element of A is also an element of B. The power set of A is the set of all subsets of A.","If a set has n elements, its power set has 2ⁿ elements."],

 ],formulas:["n(A ∪ B) = n(A) + n(B) − n(A ∩ B)","Number of subsets of a set with n elements = 2ⁿ"]

 {q:"Binomial nomenclature uses:",o:["One name","Two names","Three numbers","A local name only"],a:1,e:"A scientific species name has two parts: genus and specific epithet."}
 ]
};
let selectedStream=null,selectedSubject=null,selectedChapter=null,quizIndex=0,quizScore=0,quizAnswered=false;
const $=id=>document.getElementById(id);
function enterApp(){$("splash").classList.add("hidden");$("app").classList.remove("hidden");goHome()}
function goHome(){selectedStream=null;selectedSubject=null;selectedChapter=null;renderHome();window.scrollTo(0,0)}
function renderHome(){
$("view").innerHTML=`<section class="hero"><div><div class="eyebrow">VY EDU · CLASS 11</div><h1>Learn with clarity.<br>Grow with confidence.</h1><p>Choose your academic stream to explore organised subjects, chapter libraries, detailed concept lessons, practice questions and learning progress.</p></div><div class="hero-tag">CLASS 11<br>2026–27 LEARNING HUB</div></section>
<div class="section-head"><div><h2>Choose your stream</h2><div class="muted small">Your subject library will be arranged around your stream.</div></div></div>
<div class="grid">${Object.entries(streamInfo).map(([key,s])=>`<article class="card stream-card" onclick="openStream('${key}')"><div class="stream-icon">${s.icon}</div><span class="tag">${key==="Commerce"?"Business & Economics":key==="Humanities"?"Social Sciences":"Science"}</span><h3>${s.title}</h3><p>${s.desc}</p><div class="action-row"><span class="pill">Explore subjects →</span></div></article>`).join("")}</div>
<div class="section-head"><div><h2>Common subjects</h2><div class="muted small">Available alongside your main stream, depending on your school combination.</div></div></div><div class="grid">${["English","Physical Education"].map(n=>subjectCard(n)).join("")}</div>
<div class="callout" style="margin-top:20px"><strong>Learning note:</strong> Subject combinations and chapter coverage can vary by school and by the latest CBSE syllabus. VY EDU will identify the course and chapter clearly; check your school syllabus before exam preparation.</div>`;
}
function subjectCard(name){let c=courses[name];return `<article class="card subject-card" onclick="openSubject('${name}')"><div class="subject-top"><span class="subject-symbol">${c.icon}</span><span class="tag">${c.chapters.length} units</span></div><h3>${name}</h3><p>Explore the chapter catalogue, detailed explanations and practice activities.</p></article>`}
function openStream(stream){selectedStream=stream;selectedSubject=null;let names=Object.keys(courses).filter(n=>courses[n].streams.includes(stream));$("view").innerHTML=`<div class="breadcrumbs"><button onclick="goHome()">Home</button> / ${streamInfo[stream].title}</div><section class="hero"><div><div class="eyebrow">CLASS 11 STREAM</div><h1>${streamInfo[stream].title}</h1><p>${streamInfo[stream].desc}</p></div><div class="hero-tag">${names.length} SUBJECTS</div></section><div class="section-head"><div><h2>Subject library</h2><div class="muted small">Select a subject to open its chapter catalogue.</div></div></div><div class="grid">${names.map(subjectCard).join("")}</div><div class="section-head"><div><h2>Common subjects</h2><div class="muted small">These may be part of your school's subject combination.</div></div></div><div class="grid">${["English","Physical Education"].map(subjectCard).join("")}</div>`;window.scrollTo(0,0)}
function openSubject(subject){selectedSubject=subject;selectedChapter=null;let c=courses[subject];$("view").innerHTML=`<div class="breadcrumbs"><button onclick="goHome()">Home</button> / <button onclick="openStream('${selectedStream||c.streams[0]}')">${selectedStream||c.streams[0]}</button> / ${subject}</div><section class="hero"><div><div class="eyebrow">CLASS 11 SUBJECT CENTRE</div><h1>${c.icon} ${subject}</h1><p>Build understanding chapter by chapter. Open a chapter to read the lesson, review key ideas and attempt a knowledge check where available.</p></div><div class="hero-tag">${c.chapters.length} CHAPTERS / UNITS</div></section><div class="section-head"><div><h2>Chapter catalogue</h2><div class="muted small">Select any chapter to begin learning.</div></div><span class="pill">Learning library</span></div><div class="chapter-list">${c.chapters.map((ch,i)=>`<div class="chapter-row" onclick="openChapter('${escapeQuotes(ch)}')"><span class="number">${i+1}</span><div style="flex:1"><strong>${ch}</strong><small>${detailedLessons[ch]?"Detailed starter lesson available":"Chapter structure added · lesson content being expanded"}</small></div><span class="muted">→</span></div>`).join("")}</div>`;window.scrollTo(0,0)}
function escapeQuotes(s){return s.replace(/\\/g,"\\\\").replace(/'/g,"\\'")}
function openChapter(ch){selectedChapter=ch;quizIndex=0;quizScore=0;quizAnswered=false;let lesson=detailedLessons[ch];let subject=selectedSubject;let idx=courses[subject].chapters.indexOf(ch)+1;
let lessonHTML=lesson?`<p>${lesson.intro}</p>${lesson.sections.map(([h,p,ex])=>`<h3>${h}</h3><p>${p}</p><div class="callout"><strong>Example / connection:</strong> ${ex}</div>`).join("")}${lesson.formulas?.length?`<h3>Key formulas and quick revision</h3>${lesson.formulas.map(f=>`<div class="formula">${f}</div>`).join("")}`:""}`:`<p>This chapter is part of the Class 11 ${subject} learning catalogue. The chapter title and position are organised here; the full lesson text is being prepared and will be added in a later content update.</p><h3>How to study this chapter</h3><ul><li>Read the relevant NCERT section carefully and note new terms.</li><li>Break the chapter into small concepts and write a one-line summary for each.</li><li>Work through all textbook examples before attempting extra questions.</li><li>Make a list of doubts and revisit them after practice.</li></ul><div class="callout"><strong>Content status:</strong> This is a chapter placeholder, not a substitute for the complete NCERT lesson. We will expand it with topic-wise explanations, worked examples and chapter tests.</div>`; 
$("view").innerHTML=`<div class="breadcrumbs"><button onclick="goHome()">Home</button> / <button onclick="openStream('${selectedStream||courses[subject].streams[0]}')">${selectedStream||courses[subject].streams[0]}</button> / <button onclick="openSubject('${subject}')">${subject}</button> / Chapter ${idx}</div><div class="chapter-layout"><article class="panel lesson"><span class="tag">CHAPTER ${idx} · ${subject.toUpperCase()}</span><h2>${ch}</h2>${lessonHTML}<div class="action-row"><button class="secondary" onclick="openSubject('${subject}')">← Chapter catalogue</button><button class="primary" onclick="document.getElementById('quizPanel').scrollIntoView({behavior:'smooth'})">Go to practice ↓</button></div></article><aside class="panel"><h3 style="margin-top:0">Chapter study plan</h3><div class="chapter-list"><div class="chapter-row"><span class="number">1</span><div><strong>Understand</strong><small>Read each concept slowly.</small></div></div><div class="chapter-row"><span class="number">2</span><div><strong>Connect</strong><small>Link examples to the concept.</small></div></div><div class="chapter-row"><span class="number">3</span><div><strong>Revise</strong><small>Recall definitions and key ideas.</small></div></div><div class="chapter-row"><span class="number">4</span><div><strong>Practise</strong><small>Attempt questions without notes.</small></div></div></div><div class="callout"><strong>Study tip</strong><br>After reading a section, close the notes and explain the idea in your own words. This checks understanding better than rereading alone.</div></aside></div><section id="quizPanel" class="panel" style="margin-top:16px"><div class="section-head" style="margin-top:0"><div><h2>Knowledge check</h2><div class="muted small">Short starter quiz · check your understanding.</div></div><span class="pill">Practice</span></div><div id="quizArea">${renderQuiz()}</div></section>`;
window.scrollTo(0,0)}
function renderQuiz(){let qs=quizzes[selectedChapter];if(!qs)return `<div class="empty">A chapter-specific quiz is being prepared for this chapter. For now, use the study plan and textbook exercises to practise. Detailed quiz sets will be added as the chapter lessons are expanded.</div>`;if(quizIndex>=qs.length)return `<div class="callout"><h3>Practice complete!</h3><p>You scored <strong>${quizScore} / ${qs.length}</strong>. Review the explanations and revisit any concept you found difficult.</p></div><button class="primary" onclick="openChapter('${escapeQuotes(selectedChapter)}')">Try again</button>`;let q=qs[quizIndex];return `<div class="muted small">QUESTION ${quizIndex+1} OF ${qs.length} · SCORE ${quizScore}</div><h3>${q.q}</h3>${q.o.map((o,i)=>`<button class="quiz-option" id="opt${i}" onclick="answerQuiz(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}<div id="feedback"></div><div class="action-row"><button id="nextQ" class="primary hidden" onclick="nextQuestion()">Next question →</button></div>`}
function answerQuiz(choice){if(quizAnswered)return;let qs=quizzes[selectedChapter],q=qs[quizIndex];quizAnswered=true;if(choice===q.a)quizScore++;q.o.forEach((_,i)=>{let el=$("opt"+i);if(i===q.a)el.classList.add("correct");else if(i===choice)el.classList.add("wrong");el.disabled=true});$("feedback").innerHTML=`<div class="quiz-feedback"><strong>${choice===q.a?"Correct!":"Not quite."}</strong> ${q.e}</div>`;$("nextQ").classList.remove("hidden")}
function nextQuestion(){quizIndex++;quizAnswered=false;$("quizArea").innerHTML=renderQuiz()}
function searchContent(term){let q=term.trim().toLowerCase();if(!q){if(selectedSubject)openSubject(selectedSubject);else if(selectedStream)openStream(selectedStream);else renderHome();return}let matches=[];Object.entries(courses).forEach(([s,c])=>{if(s.toLowerCase().includes(q))matches.push({subject:s,chapter:null});c.chapters.forEach(ch=>{if(ch.toLowerCase().includes(q))matches.push({subject:s,chapter:ch})})});$("view").innerHTML=`<div class="breadcrumbs"><button onclick="goHome()">Home</button> / Search</div><h2>Search results</h2><p class="muted">Matches for “${term.replace(/[<>]/g,"")}”</p><div class="chapter-list">${matches.length?matches.map(m=>`<div class="chapter-row" onclick="${m.chapter?`openSubject('${m.subject}');setTimeout(()=>openChapter('${escapeQuotes(m.chapter)}'),0)`:`openSubject('${m.subject}')`}"><span class="number">${courses[m.subject].icon}</span><div><strong>${m.chapter||m.subject}</strong><small>${m.subject}</small></div><span class="muted">→</span></div>`).join(""):`<div class="empty">No matching subjects or chapters found.</div>`}</div>`}
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js")
      .then(() => console.log("VY EDU PWA ready"))
      .catch((error) =>
        console.error("Service worker registration failed:", error)
      );
  });
}
</script>
</body>
</html>
